---
name: ci
"on":
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.1
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write
  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [default, remove]
        platform:
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - amazonlinux-2023
          - centos-stream-9
          - centos-stream-10
          - debian-12
          - debian-13
          - fedora-latest
          - oraclelinux-8
          - oraclelinux-9
          - oraclelinux-10
          - rockylinux-8
          - rockylinux-9
          - rockylinux-10
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.1
      - name: Test Snort lifecycle
        env:
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          CHEF_LICENSE: accept-no-persist
        run: |
          platform="${{ matrix.platform }}"
          chef exec kitchen test "${{ matrix.suite }}-${platform//./}" --destroy=always
